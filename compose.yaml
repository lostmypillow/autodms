services:
    db:
        image: amazon/dynamodb-local:3.3.1
        container_name: dms-db-local
        env_file:
            - .env
        networks:
            - dms-internal-local-net
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000'",
                ]
            interval: 1s
            timeout: 2s
            retries: 10
            start_period: 2s
    api:
        container_name: dms-api-local
        build:
            context: .
            dockerfile: ./api/Dockerfile
        env_file:
            - .env
        networks:
            - dms-internal-local-net
        depends_on:
            db:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
    frontend:
        container_name: dms-frontend-local
        build:
            context: .
            dockerfile: ./frontend/Dockerfile
            args:
                BUILD_SCRIPT: build:dev
        ports:
            - '5173:80'
        networks:
            - dms-internal-local-net
            - dms-external-local-net
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
        depends_on:
            api:
                condition: service_started

networks:
    dms-internal-local-net:
        driver: bridge
        name: dms-internal-local-net
        internal: true
    dms-external-local-net:
        driver: bridge
