name: CI & Staging Deploy (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: node-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Checks (Typecheck, Lint & Vitest)
        run: pnpm run ci


  deploy-api:
    name: Deploy dev API to Docker
    needs: [test]
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build & Deploy Self-Hosted dev Containers
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          echo "Deploying updated Docker containers to dev environment..."
          docker compose -f compose.dev.yaml down
          docker compose -f compose.dev.yaml up -d --build

  e2e:
    name: E2E test
    needs: [deploy-api]
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers (if missing)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: pnpm exec playwright install chromium

      - name: Run Playwright against Dev Deployment
        env:
          CI: true
          E2E_URL: "https://dms-dev.lostmypillow.com"
        run: pnpm run e2e:ci
