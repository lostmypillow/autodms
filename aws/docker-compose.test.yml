services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: test-dynamodb
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000'" ]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 2s

