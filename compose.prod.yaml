services:
  dms-db-prod:
    image: amazon/dynamodb-local:latest
    container_name: dms-db-prod
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000'" ]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 2s
    networks:
      proxy-net:

  dms-prod:
    container_name: dms-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_MODE: prod
    env_file:
      - .env.dev
    depends_on:
      dms-db-prod:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      proxy-net:

networks:
  proxy-net:
    external: true
