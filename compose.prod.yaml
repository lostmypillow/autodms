services:
  autodms-prod:
    container_name: autodms-dynamodb
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    depends_on:
      autodms-dynamodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      proxy-net:

networks:
  proxy-net:
    external: true