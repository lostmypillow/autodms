name: Core Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'core/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm run test --workspace=core
